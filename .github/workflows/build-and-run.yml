name: Hello, World!

# Run automatically on every push (or manually).
on:
  push:
  workflow_dispatch:

# Grant read-only access to repository contents.
permissions:
  contents: read

jobs:
  build-and-run:
    name: Build Pipeline
    runs-on: windows-latest

    steps:
      # Check out the repository source code.
      - name: Check Out Repository
        uses: actions/checkout@v5
    
      # Install the latest CMake release from PyPI.
      - name: Install CMake
        shell: pwsh
        run: |
          python -m pip install --upgrade cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Add Python's scripts directory to PATH for subsequent steps.
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $scripts | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Install the latest .NET 10 SDK.
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Install GNU Fortran using the MSYS2 UCRT64 toolchain.
      - name: Install GNU Fortran
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran
          msystem: UCRT64

      # Make GNU Fortran available to subsequent PowerShell steps.
      - name: Configure GNU Fortran
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Build, run, and validate each language.
      - name: Execute Script
        shell: pwsh
        run: |
          ./build-and-run.ps1
